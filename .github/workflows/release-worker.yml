name: Release RandomX worker

# Builds the pinned RandomX worker on each published platform from this
# repository's source, runs the unmodified upstream suite, the upstream vector
# probe and the Arcals worker vectors, then attaches the binaries and their
# SHA-256 checksums to the GitHub Release for the pushed worker-v* tag. The
# manifest in a later Agent release (v*) references only these assets.

on:
  push:
    tags: ["worker-v*"]

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
          - platform: darwin-arm64
            runner: macos-15
    steps:
      - name: Check out repository and pinned submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
      - name: Install native build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake g++
      - name: Report toolchain
        run: |
          uname -a
          cmake --version | head -1
          c++ --version | head -1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build protocol package
        run: pnpm --filter @arcals/protocol build
      - name: Unmodified upstream suite and vector probe
        run: bash native/randomx-worker/scripts/test-upstream.sh
      - name: Build worker
        run: bash native/randomx-worker/scripts/build.sh
      - name: Worker vectors (Fast/Light, JIT/interpreter, target, cancel)
        run: npx tsx tools/benchmark/src/integration.ts > integration.json
      - name: Package binary and checksum
        run: |
          mkdir -p dist
          name="arcals-randomx-worker-${{ matrix.platform }}"
          cp native/randomx-worker/build/arcals-randomx-worker "dist/$name"
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "$name" > "$name.sha256")
          else
            (cd dist && shasum -a 256 "$name" > "$name.sha256")
          fi
          cat "dist/$name.sha256"
      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  release:
    name: publish-release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Combine checksums
        run: |
          cd dist
          cat *.sha256 | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "RandomX worker builds for ${GITHUB_REF_NAME}. Verify each binary against SHA256SUMS and the manifest in this tag." \
            dist/arcals-randomx-worker-* dist/SHA256SUMS
